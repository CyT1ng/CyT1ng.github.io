<body>
  <main>
    <button class="window-close" type="button" aria-label="Close page"></button>
<pre>Yinting (James) Chen

<div class="footer">

</div>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const closeBtn = document.querySelector(".window-close");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          window.open("", "_self");
          window.close();
        });
      }
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      const set = (x, y) => {
        root.style.setProperty("--cursor-x", `${x}px`);
        root.style.setProperty("--cursor-y", `${y}px`);
      };
      set(window.innerWidth / 2, window.innerHeight / 2);
      window.addEventListener("pointermove", (e) => set(e.clientX, e.clientY), { passive: true });
      window.addEventListener("pointerdown", (e) => set(e.clientX, e.clientY), { passive: true });
      window.addEventListener(
        "touchmove",
        (e) => {
          if (!e.touches || !e.touches[0]) return;
          set(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true }
      );
    })();
  </script>
</body>
</html>
