  <script>
    (() => {
      const root = document.documentElement;
      const closeBtn = document.querySelector(".window-close");
      const isHome = () => {
        const path = window.location.pathname;
        return path === "/" || path.endsWith("/index.html");
      };
      const requestClose = () => {
        if (!isHome()) {
          window.location.href = "/";
          return;
        }
        window.open("", "_self");
        window.close();
        setTimeout(() => {
          if (document.visibilityState === "hidden") return;
          window.location.href = "about:blank";
        }, 120);
      };
      if (closeBtn) {
        closeBtn.addEventListener("click", requestClose);
      }
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      const set = (x, y) => {
        root.style.setProperty("--cursor-x", `${x}px`);
        root.style.setProperty("--cursor-y", `${y}px`);
      };
      set(window.innerWidth / 2, window.innerHeight / 2);
      window.addEventListener("pointermove", (e) => set(e.clientX, e.clientY), { passive: true });
      window.addEventListener("pointerdown", (e) => set(e.clientX, e.clientY), { passive: true });
      window.addEventListener(
        "touchmove",
        (e) => {
          if (!e.touches || !e.touches[0]) return;
          set(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true }
      );
    })();
  </script>
